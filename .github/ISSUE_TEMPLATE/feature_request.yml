# path: .github/ISSUE_TEMPLATE/feature_request.yml
name: Feature Request
description: Suggest an idea or enhancement for Invoice Studio
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We love suggestions that enhance the Kenyan freelance & SME invoicing experience while respecting our **100% offline-first & zero data loss** baseline.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem or limitation is.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe Alternatives You've Considered
      description: Any alternative solutions or workarounds you've thought about.
    validations:
      required: false
  - type: checkboxes
    id: offline_compliance
    attributes:
      label: Offline & Architecture Compliance
      options:
        - label: This proposed feature does not require a hard, always-on cloud connection to function.
          required: true
        - label: This feature aligns with integer minor-unit financial arithmetic and zero data loss.
          required: true

