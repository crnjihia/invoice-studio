# path: .github/workflows/release.yml
name: Release Multi-Platform Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not publish draft release)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-package:
    name: Package ${{ matrix.name }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (NSIS)
            os: windows-latest
            target_flag: --win
          - name: macOS (DMG & Universal)
            os: macos-latest
            target_flag: --mac
          - name: Linux (AppImage & DEB)
            os: ubuntu-latest
            target_flag: --linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Enable Developer Mode (symlinks) on Windows
        if: runner.os == 'Windows'
        run: |
          reg add "HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libfuse2 xvfb

      - name: Install dependencies
        run: npm ci

      - name: Verify linter and typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Run test suite
        run: |
          if [ "${{ runner.os }}" == "Linux" ]; then
            xvfb-run --auto-servernum -- npm run test
          else
            npm run test
          fi
        shell: bash

      - name: Compile Vite bundle
        run: npm run build

      - name: Rebuild native better-sqlite3 for Electron
        run: node scripts/setup-deps.js --force || npx @electron/rebuild -f -w better-sqlite3

      - name: Package installer with electron-builder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Windows Code Signing (Optional CI secrets)
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # macOS Code Signing & Notarisation (Optional CI secrets)
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          [ -z "$WIN_CSC_LINK" ] && unset WIN_CSC_LINK
          [ -z "$CSC_LINK" ] && unset CSC_LINK
          [ -z "$APPLE_ID" ] && unset APPLE_ID
          [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] && unset APPLE_APP_SPECIFIC_PASSWORD
          [ -z "$APPLE_TEAM_ID" ] && unset APPLE_TEAM_ID
          npx electron-builder ${{ matrix.target_flag }} --publish ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run) && 'always' || 'never' }}

      - name: Generate SHA-256 Checksums
        run: node scripts/generate-checksums.js

      - name: Verify release assets
        run: node scripts/verify-release-assets.js

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.yml
            dist/SHA256SUMS*.txt
          retention-days: 7

      - name: Upload Checksums to GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag_name="${GITHUB_REF#refs/tags/}"
          gh release upload "$tag_name" dist/SHA256SUMS*.txt --clobber || true
